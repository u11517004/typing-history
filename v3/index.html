<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英打遊戲版本三 - ASDF 練習</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f3ec;
      color: #243e38;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .game-card {
      background: white;
      border: 1px solid #ccd7ce;
      border-radius: 18px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 90%;
    }
    .target-letter {
      font-size: 72px;
      font-weight: bold;
      color: #b16b35;
      margin: 20px 0;
      height: 90px;
      line-height: 90px;
    }
    .score-board {
      font-size: 20px;
      margin-bottom: 20px;
      color: #245e50;
    }
    .keyboard {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .key {
      width: 50px;
      height: 50px;
      border: 2px solid #245e50;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      background: white;
      transition: all 0.1s ease;
    }
    .key.active {
      background: #b16b35;
      color: white;
      border-color: #b16b35;
      transform: scale(1.1);
    }
    .btn {
      padding: 10px 20px;
      font-size: 16px;
      background: #245e50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 5px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:hover { background: #1b473c; }
    .btn-secondary {
      background: #888;
    }
    .btn-secondary:hover { background: #666; }
  </style>
</head>
<body>

<div class="game-card">
  <h1>英打遊戲版本三：ASDF 練習</h1>
  <div class="score-board">得分：<span id="score">0</span></div>
  <div class="target-letter" id="targetLetter">?</div>

  <div class="keyboard">
    <div class="key" id="key-A">A</div>
    <div class="key" id="key-S">S</div>
    <div class="key" id="key-D">D</div>
    <div class="key" id="key-F">F</div>
  </div>

  <div>
    <button class="btn" id="startBtn">開始遊戲</button>
    <a href="../index.html" class="btn btn-secondary">返回歷程首頁</a>
  </div>
</div>

<script>
  const keys = ['A', 'S', 'D', 'F'];
  let currentTarget = '';
  let score = 0;
  let isPlaying = false;

  const targetDisplay = document.getElementById('targetLetter');
  const scoreDisplay = document.getElementById('score');
  const startBtn = document.getElementById('startBtn');

  function nextQuestion() {
    const randomIndex = Math.floor(Math.random() * keys.length);
    currentTarget = keys[randomIndex];
    targetDisplay.textContent = currentTarget;

    // 清除舊的亮燈，並亮起對應按鍵
    keys.forEach(k => document.getElementById(`key-${k}`).classList.remove('active'));
    document.getElementById(`key-${currentTarget}`).classList.add('active');
  }

  startBtn.addEventListener('click', () => {
    isPlaying = true;
    score = 0;
    scoreDisplay.textContent = score;
    startBtn.textContent = '重新開始';
    nextQuestion();
  });

  window.addEventListener('keydown', (e) => {
    if (!isPlaying || e.repeat) return;

    const pressedKey = e.key.toUpperCase();
    if (keys.includes(pressedKey)) {
      if (pressedKey === currentTarget) {
        score++;
        scoreDisplay.textContent = score;
        nextQuestion();
      }
    }
  });
</script>

</body>
</html>
